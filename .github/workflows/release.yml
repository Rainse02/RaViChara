name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use minimal Rust profile
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup update stable --no-self-update
          rustup default stable
      - name: Release preflight
        shell: pwsh
        run: .\scripts\release_preflight.ps1 -RequireCleanGit -ExpectedTag $env:GITHUB_REF_NAME
      - name: Rust tests
        run: cargo test --locked
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Build portable package
        shell: pwsh
        run: .\scripts\package_windows.ps1
      - name: Create artifact checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $manifest = Get-Content `
            blender_addons/ravichara_preview_bridge/blender_manifest.toml -Raw
          $addonVersion = [regex]::Match(
            $manifest,
            '(?m)^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"\s*$'
          ).Groups['version'].Value
          if (-not $addonVersion) {
            throw 'Could not read Blender add-on version.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV `
            -Value "RAVICHARA_ADDON_VERSION=$addonVersion"
          $required = @(
            "dist/RaViChara-$version-Windows-x64-portable.zip",
            "dist/RaViChara-$version-Windows-x64-portable.zip.sha256",
            "blender_addons/ravichara_preview_bridge-$addonVersion.zip",
            "blender_addons/ravichara_preview_bridge-$addonVersion.zip.sha256"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release artifact is missing: $file"
            }
          }
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME `
            --verify-tag `
            --title "RaViChara $version" `
            --generate-notes `
            "dist/RaViChara-$version-Windows-x64-portable.zip" `
            "dist/RaViChara-$version-Windows-x64-portable.zip.sha256" `
            "blender_addons/ravichara_preview_bridge-$env:RAVICHARA_ADDON_VERSION.zip" `
            "blender_addons/ravichara_preview_bridge-$env:RAVICHARA_ADDON_VERSION.zip.sha256"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Light bleeding gradients -->
    <radialGradient id="sunlight-glow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-shadow-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Feathered border mask -->
    <linearGradient id="edge-fade-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Color Bleed Layer (0.0% GPU cost) -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#sunlight-glow)" />
  <rect x="0" y="0" width="1200" height="800" fill="url(#ambient-shadow-glow)" />
</svg>
